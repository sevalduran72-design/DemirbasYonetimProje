services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd
        -S sqlserver
        -U sa
        -P "$$MSSQL_SA_PASSWORD"
        -C
        -b
        -Q "IF DB_ID(N'DemirbasYonetimProjeDB') IS NULL CREATE DATABASE [DemirbasYonetimProjeDB]"
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5181
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DemirbasYonetimProjeDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;"
      AppSettings__DefaultAdminUser: ${APP_ADMIN_USER:?Set APP_ADMIN_USER in .env}
      AppSettings__DefaultAdminPassword: ${APP_ADMIN_PASSWORD:?Set APP_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5181:5181"
    restart: unless-stopped

volumes:
  sqlserver-data:
